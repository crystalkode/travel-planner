version: "1"
projects:
  - name: Travel Planner
    environments:
      - name: Production
        services:
          - type: web
            name: travel-planner
            runtime: node
            repo: https://github.com/crystalkode/travel-planner
            plan: free
            envVars:
              - key: DEV_USER_ID
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: test-travel-planner-db
                  property: connectionString
            region: oregon
            buildCommand: pnpm install && pnpm --filter backend build
            preDeployCommand: pnpm --filter backend db:deploy
            startCommand: pnpm --filter backend start
            autoDeployTrigger: commit
        databases:
          - name: test-travel-planner-db
            databaseName: test_travel_planner_db
            user: test_travel_planner_db_user
            plan: free
            region: oregon
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere
            postgresMajorVersion: "18"
